{{/*
=============================================================================================
 These two objects are emitted from ONE template execution. Do not split them into two files.
=============================================================================================

They are the two halves of a single value: the `pathPrefix` the tunnel is published at.

  * the Secret carries it, and the Deployment reads it into
    WSTUNNEL_RESTRICT_HTTP_UPGRADE_PATH_PREFIX -- the value the SERVER enforces
  * the Ingress carries it as the path nginx ROUTES ON

If those two ever disagree, nginx forwards requests the server then refuses, every client gets a 404,
and nothing anywhere reports an error. They disagreed once before: the prefix was generated by a
helper, Helm re-executes a helper at every `include`, and each file got its own value -- so a fresh
install could not work at all.

A value generated during a render cannot be observed by another template, so the only way to
generate this one is to compute it HERE, once, and use this one variable for both documents.
*/}}
{{- $prefix := "" -}}
{{- if or (not .Values.existingSecret) .Values.ingress.enabled -}}
{{- $prefix = include "k8s-tunnel-server.pathPrefix" . -}}
{{- end }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-tunnel-server.prefixSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-tunnel-server.labels" . | nindent 4 }}
  annotations:
    # Keep this if the release is ever uninstalled -- otherwise a reinstall mints a NEW prefix and
    # every client's bookmarked URL breaks.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ONLY the prefix. The basic-auth password deliberately lives elsewhere (see
  # basic-auth-secret.yaml): a stale second copy here would survive rotation and mislead.
  prefix: {{ $prefix | quote }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required — refusing to render a host-less rule. A rule with an empty host does NOT join the intended vhost; it lands in ingress-nginx's default server block, which serves any unmatched Host and shadows direct-IP access on a shared controller." }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "k8s-tunnel-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-tunnel-server.labels" . | nindent 4 }}
  annotations:
    # Default false, for the topology this chart is built around: the LB terminates TLS and
    # forwards plain HTTP, so a forced redirect here would loop -- nginx 308s, the client retries
    # with TLS, the LB strips it, nginx 308s again. Set ingress.forceSSLRedirect only if your LB
    # genuinely forwards X-Forwarded-Proto. It does not affect the redirect that ingress-nginx
    # already does on its own when ingress.tls.enabled is true.
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.ingress.forceSSLRedirect | quote }}
    # Defaults are 60s; a quiet tunnel would be reaped. The client's 30s websocket ping is
    # what actually keeps it alive -- these just ensure nginx does not give up first.
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.proxyReadTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.proxySendTimeout | quote }}
    # Never buffer a tunnel.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if .Values.basicAuth.enabled }}
    # wstunnel v11's server cannot verify basic auth (--http-upgrade-credentials is
    # client-only), so nginx validates the Authorization header the client sends.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ include "k8s-tunnel-server.basicAuthSecretName" . }}
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.basicAuth.realm | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  # Terminate TLS here rather than in front. This chart does not create any certificate: it either
  # names an existing Secret (or one cert-manager will create), or names none at all.
  #
  # secretName is left OUT rather than set to "" when it is empty. A tls entry that lists a host
  # and names no Secret is a working configuration, not a half-finished one: ingress-nginx still
  # forces the HTTPS redirect and serves its --default-ssl-certificate.
  tls:
  - hosts:
    - {{ .Values.ingress.host | quote }}
    {{- with .Values.ingress.tls.secretName }}
    secretName: {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      # No rewrite-target: with wstunnel the path IS the secret, and stripping it would remove
      # the primary auth factor. nginx passes it through unmodified.
      - path: /{{ $prefix }}
        pathType: {{ .Values.ingress.pathType }}
        backend:
          service:
            name: {{ include "k8s-tunnel-server.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}
