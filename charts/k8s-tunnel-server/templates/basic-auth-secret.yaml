{{- if and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret) }}
{{/*
Resolved ONCE, here, and reused for both keys below. A second resolution -- which is what an
`htpasswd ... (include "k8s-tunnel-server.basicAuthPassword" .)` call would be -- generates a SECOND
password, and `auth` would then be the hash of something other than the plaintext stored beside it.
That is not hypothetical: it is why every password retrieved from this Secret used to return 401.

Reading the stored PLAINTEXT rather than the stored hash is also deliberate. On an upgrade it makes
`password` the value the operator was already told, and `auth` is re-hashed from it, so a release
installed before that bug was fixed is REPAIRED by its next upgrade rather than staying broken
forever. The hash therefore changes on every render (sprig's htpasswd salts freshly each call),
which rewrites this Secret on each `helm upgrade`. That churn is cosmetic -- nginx re-reads it -- and
it is the price of the repair.
*/}}
{{- $password := include "k8s-tunnel-server.basicAuthPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-tunnel-server.basicAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-tunnel-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # nginx reads this key. Its value must be an htpasswd line.
  auth: {{ htpasswd .Values.basicAuth.user $password | quote }}
  # Plaintext, so the password can be retrieved and clients configured. A bcrypt hash is one-way,
  # so without this the password would be unrecoverable. Same material as `auth`, same trust level.
  password: {{ $password | quote }}
  user: {{ .Values.basicAuth.user | quote }}
{{- end }}
