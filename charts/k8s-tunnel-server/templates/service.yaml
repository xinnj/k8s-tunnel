apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-tunnel-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-tunnel-server.labels" . | nindent 4 }}
spec:
  # ClusterIP only. Nothing outside the cluster should reach this directly; the ingress is the
  # only intended path in.
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-tunnel-server.selectorLabels" . | nindent 4 }}
  ports:
  - name: ws
    port: {{ .Values.service.port }}
    targetPort: 8080
    protocol: TCP
